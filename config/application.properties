server.port=8883

# 日志等级
logging.level.root=INFO
logging.level.cn.wildfirechat=DEBUG
logging.level.cn.wildfirechat.sdk=DEBUG
logging.level.dev.onvoid.webrtc=DEBUG
# 请求分发与404的调试日志
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.servlet.PageNotFound=DEBUG

#turn server address
ice.url=turn:turn.wildfirechat.net:3478
ice.username=wfchat
ice.password=wfchat1

# 音视频高级版janus服务地址替换关系（仅高级版音视频使用）。
# 当本服务与janus服务部署在同一内网时使用，把SDP中janus的公网IP替换为内网IP，避免走公网。
# 格式：公网IP:内网IP，多组之间用英文逗号分隔
#sdp.ip.replace.map=1.2.3.4:192.168.1.10,5.6.7.8:192.168.1.11

#video file path
video.file.path=./config/foreman.mp4

#是否只发送音视频，不接收对方的音视频流（仅对高级版音视频有效），true为只发不收
call.send.only=true
#是否定期抓取对端视频截屏保存为bmp文件到运行目录（调试用，长时间运行会产生大量磁盘文件）
video.snapshot.enabled=true
